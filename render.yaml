# ==============================================================================
# RENDER DEPLOYMENT BLUEPRINT (render.yaml)
# Smart AI Face Recognition System
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: face-engine-backend
    env: python
    region: singapore
    plan: starter
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install 'numpy<2.0.0' Cython && pip install -r backend/requirements.txt && python -c \"from insightface.app import FaceAnalysis; FaceAnalysis(name='buffalo_l', providers=['CPUExecutionProvider'], allowed_modules=['detection', 'recognition'])\""
    startCommand: "cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard
      - key: DB_NAME
        value: sentinel_fr
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        value: admin123
      - key: FACE_MATCH_THRESHOLD
        value: "0.42"
      - key: UPLOAD_ROOT
        value: "./uploads"
      - key: CORS_ORIGINS
        value: "*"
      - key: RESEND_API_KEY
        sync: false
      - key: SENDER_EMAIL
        value: onboarding@resend.dev
      - key: ALERT_TO
        sync: false

  # ----------------------------------------------------------------------------
  # 2. React Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: face-engine-frontend
    env: static
    buildCommand: "cd frontend && npm install --legacy-peer-deps && npm run build"
    staticPublishPath: ./frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: face-engine-backend
          property: host
